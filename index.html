<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: white; min-height: 100vh; }
        .card { background: #1e293b; border: none; color: white; }
        .subject-header { cursor: pointer; transition: background 0.2s; }
        .subject-header:hover { background: #334155 !important; }
        .homework-item { background: #020617; border-radius: 8px; margin-bottom: 8px; padding: 12px; cursor: pointer; }
        .desc { font-size: 0.9rem; color: #cbd5e1; margin-top: 8px; display: none; }
        input, select, textarea { background: #0f172a !important; border: 1px solid #334155 !important; color: white !important; }
        input::placeholder, textarea::placeholder { color: #64748b !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-black mb-4">
    <div class="container justify-content-center">
        <ul class="nav nav-pills">
            <li class="nav-item">
                <a class="nav-link active" id="tab-add" href="#" onclick="showTab('add')">Add</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="tab-view" href="#" onclick="showTab('view')">View</a>
            </li>
        </ul>
    </div>
</nav>

<div class="container">
    <div id="alertBox" class="mb-3" style="display:none;"></div>

    <div id="addTab">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg p-4">
                    <h2 class="h4 mb-3">Add Homework</h2>

                    <div class="d-flex mb-3">
                        <select id="subject" class="form-select me-2"></select>
                        <button class="btn btn-outline-light" onclick="openSubjectDialog()">+</button>
                    </div>

                    <input id="title" class="form-control mb-3" placeholder="Title">
                    <input type="date" id="date" class="form-control mb-3">
                    <textarea id="desc" class="form-control mb-3" rows="3" placeholder="Description"></textarea>
                    <button class="btn btn-primary w-100" onclick="saveHomework()">Save Homework</button>
                </div>
            </div>
        </div>
    </div>

    <div id="viewTab" style="display:none;"></div>
</div>

<!-- ADD SUBJECT DIALOG -->
<div id="subjectDialog" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;">
    <div style="background:#1e293b;padding:20px;border-radius:10px;width:300px;">
        <h5>Add Subject</h5>
        <input id="newSubject" class="form-control mb-3" placeholder="Subject name">
        <div class="d-flex justify-content-end">
            <button class="btn btn-secondary me-2" onclick="closeSubjectDialog()">Cancel</button>
            <button class="btn btn-primary" onclick="addSubject()">Add</button>
        </div>
    </div>
</div>

<!-- DELETE SUBJECT DIALOG -->
<div id="deleteDialog" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;">
    <div style="background:#1e293b;padding:20px;border-radius:10px;width:320px;">
        <h5 id="deleteText"></h5>
        <div class="d-flex justify-content-end mt-3">
            <button class="btn btn-secondary me-2" onclick="closeDeleteDialog()">No</button>
            <button class="btn btn-danger" onclick="confirmDelete()">Yes</button>
        </div>
    </div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('hw')) || {};
let openSubject = null;

let subjects = JSON.parse(localStorage.getItem('subjects')) || 
['Math','Science','SST','English','Hindi','ICT'];

let deleteTarget = null;

/* SUBJECT SYSTEM */
function loadSubjects(){
    let select = document.getElementById('subject');
    select.innerHTML = '';
    subjects.forEach(s=>{
        let opt = document.createElement('option');
        opt.textContent = s;
        select.appendChild(opt);
    });
}

function openSubjectDialog(){
    document.getElementById('subjectDialog').style.display = 'flex';
}

function closeSubjectDialog(){
    document.getElementById('subjectDialog').style.display = 'none';
}

function addSubject(){
    let val = document.getElementById('newSubject').value.trim();
    if(!val) return;
    if(!subjects.includes(val)){
        subjects.push(val);
        localStorage.setItem('subjects', JSON.stringify(subjects));
        loadSubjects();
    }
    document.getElementById('newSubject').value = '';
    closeSubjectDialog();
}

/* DELETE SUBJECT */
function openDeleteDialog(subject){
    deleteTarget = subject;
    document.getElementById('deleteText').innerText = `Do you want to delete "${subject}"?`;
    document.getElementById('deleteDialog').style.display = 'flex';
}

function closeDeleteDialog(){
    document.getElementById('deleteDialog').style.display = 'none';
}

function confirmDelete(){
    if(deleteTarget){
        subjects = subjects.filter(s => s !== deleteTarget);
        delete data[deleteTarget];

        localStorage.setItem('subjects', JSON.stringify(subjects));
        localStorage.setItem('hw', JSON.stringify(data));

        deleteTarget = null;
        closeDeleteDialog();
        loadSubjects();
        render();
    }
}

function showTab(tab){
    document.getElementById('addTab').style.display = tab==='add'?'block':'none';
    document.getElementById('viewTab').style.display = tab==='view'?'block':'none';
    
    document.getElementById('tab-add').classList.toggle('active', tab === 'add');
    document.getElementById('tab-view').classList.toggle('active', tab === 'view');
    
    if(tab==='view') render();
}

function saveHomework(){
    let s=document.getElementById('subject').value;
    let t=document.getElementById('title').value.trim();
    let d=document.getElementById('date').value;
    let desc=document.getElementById('desc').value;
    if(!t) return;
    if(!data[s]) data[s]=[];
    data[s].push({title:t,date:d,desc:desc});
    localStorage.setItem('hw',JSON.stringify(data));
    alert('Homework Saved!');
}

function getDiff(date){
    let today=new Date();
    today.setHours(0,0,0,0);
    let due=new Date(date);
    return Math.ceil((due-today)/(1000*60*60*24));
}

function checkAlerts(){
    let box=document.getElementById('alertBox');
    let result={};

    for(let s in data){
        data[s].forEach(hw=>{
            if(!hw.date) return;
            let diff=getDiff(hw.date);

            if(diff<0){
                if(!result[s] || result[s].type!=='overdue' || Math.abs(diff)>result[s].days){
                    result[s]={type:'overdue',days:Math.abs(diff)};
                }
            } else if(diff<=3){
                if(!result[s]) result[s]={type:'soon',days:diff};
                else if(result[s].type==='soon' && diff<result[s].days) result[s].days=diff;
            }
        });
    }

    let html='';
    for(let s in result){
        let r=result[s];
        if(r.type==='overdue'){
            html += `<div class="alert alert-danger py-2 mb-2">⚠️ <strong>${s}</strong> overdue by ${r.days} day${r.days==1?'':'s'}</div>`;
        } else {
            html += `<div class="alert alert-warning py-2 mb-2">🟡 <strong>${s}</strong> due in ${r.days} day${r.days==1?'':'s'}</div>`;
        }
    }

    if(html){box.innerHTML=html;box.style.display='block';}
    else box.style.display='none';
}

function render(){
    checkAlerts();
    let view=document.getElementById('viewTab');
    view.innerHTML='';

    if(Object.keys(data).length===0){
        view.innerHTML = `
            <div class="text-center mt-5 opacity-50">
                <div style="font-size: 4rem;">🤸</div>
                <h3>No Homework!</h3>
            </div>`;
        return;
    }

    for(let s in data){
        let container = document.createElement('div');
        container.className = 'mb-3';

        let header = document.createElement('div');
        header.className = 'card subject-header p-3 fw-bold d-flex justify-content-between align-items-center flex-row';
        header.innerHTML = `<span>${s}</span> <span class="badge bg-secondary">${data[s].length}</span>`;

        // CLICK
        header.onclick = () => {
            openSubject = openSubject === s ? null : s;
            render();
        };

        // DOUBLE CLICK TO DELETE
        header.ondblclick = () => {
            openDeleteDialog(s);
        };

        let list = document.createElement('div');
        list.className = 'mt-2 ms-3';
        list.style.display = openSubject === s ? 'block' : 'none';

        data[s].forEach((hw, i) => {
            let hwDiv = document.createElement('div');
            hwDiv.className = 'homework-item shadow-sm';

            let diff = hw.date ? getDiff(hw.date) : null;
            let statusBadge = '';
            
            if(diff !== null) {
                if(diff < 0) statusBadge = `<span class="text-danger fw-bold">🔴 Late ${Math.abs(diff)}d</span>`;
                else if(diff <= 3) statusBadge = `<span class="text-warning fw-bold">🟡 Due ${diff}d</span>`;
            }

            hwDiv.innerHTML = `
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <div class="fw-bold">${hw.title} ${statusBadge}</div>
                        <div class="desc" id="desc-${s}-${i}">${hw.desc || 'No description'}</div>
                    </div>
                    <button class="btn btn-sm btn-outline-success ms-2" onclick="event.stopPropagation(); deleteHW('${s}',${i})">Done</button>
                </div>
            `;

            hwDiv.onclick = () => {
                let d = document.getElementById(`desc-${s}-${i}`);
                d.style.display = d.style.display === 'none' ? 'block' : 'none';
            };

            list.appendChild(hwDiv);
        });

        container.appendChild(header);
        container.appendChild(list);
        view.appendChild(container);
    }
}

function deleteHW(s,i){
    data[s].splice(i,1);
    if(data[s].length===0){delete data[s];openSubject=null;}
    localStorage.setItem('hw',JSON.stringify(data));
    render();
}

loadSubjects();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
